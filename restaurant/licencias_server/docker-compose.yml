# ─── Servidor central de licencias · Docker Compose ─────────────────────────
# Este proyecto se despliega UNA sola vez y da servicio a VARIOS POS.
#
#   Inicio:  docker compose up -d --build
#   Logs:    docker compose logs -f
#   Paro:    docker compose down        (no borra datos)
#
#   Panel:   http://<host>:${LICENCIAS_HTTP_PORT}/panel/   (dashboard React)
#   Admin:   http://<host>:${LICENCIAS_HTTP_PORT}/admin/    (respaldo Django)
#   API POS: http://<host>:${LICENCIAS_HTTP_PORT}/api/licencia/
#
# El dashboard se compila dentro de la imagen (etapa Node), así que no hace
# falta Node en el servidor. Para desarrollo con recarga en caliente:
#
#   cd panel && npm install && npm run dev     (http://localhost:5173/panel/)
#
# Credenciales y configuración: archivo .env (NO va a git).
# Cada POS se conecta con LICENCIA_API_URL a este servidor y con el MISMO
# LICENCIA_SECRETO. En producción va detrás del router multi-POS (HTTPS) que
# hace de proxy inverso con el certificado wildcard, igual que a cada POS.
#
# La red externa elcholi_net se comparte con las instancias POS para que el
# POS pueda llamar a http://licencias:8000 por nombre de contenedor. Se crea
# una sola vez en el servidor:  docker network create elcholi_net

name: licencias-server

volumes:
  licencias_data:      # base de datos (SQLite) del servidor de licencias
  licencias_static:    # estáticos del admin (servidos por WhiteNoise)

networks:
  elcholi_net:
    external: true
    name: ${LICENCIAS_NETWORK:-elcholi_net}

services:
  licencias:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licencias_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      DB_PATH: /app/data/db.sqlite3
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - licencias_data:/app/data
      - licencias_static:/app/staticfiles
    ports:
      - "${LICENCIAS_HTTP_PORT:-8010}:8000"
    networks:
      elcholi_net:
        aliases:
          - licencias
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s