# ─── nginx · El Choli POS ────────────────────────────────────────────────────
# Sirve los estáticos y el media, y hace de proxy hacia la aplicación.
# Funciona directo (puerto del host) o detrás del router multi-POS.

# Conserva el X-Forwarded-Proto que envíe el router (https) cuando exista;
# en acceso directo usa el esquema real de la conexión.
map $http_x_forwarded_proto $x_forwarded_proto {
    default $scheme;
    https https;
}

upstream elcholi_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30M;

    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /mediafiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://elcholi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }
}

