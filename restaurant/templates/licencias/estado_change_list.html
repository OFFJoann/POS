{% extends "admin/change_list.html" %}

{% block content %}
    <p style="margin:0 0 10px">
        <a href="{% url 'admin:licencias_config_local' %}" class="button">
            Ver LICENCIA_SECRETO de este POS
        </a>
    </p>
    {{ block.super }}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('btn-secreto')?.addEventListener('click', function () {
            var box = document.getElementById('secreto');
            var visible = box.textContent === box.dataset.secreto;
            box.textContent = visible ? '----------------------------' : box.dataset.secreto;
            this.textContent = visible ? 'Mostrar' : 'Ocultar';
        });
    });
    </script>
{% endblock %}
